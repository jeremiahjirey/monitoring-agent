apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadsim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadsim
  template:
    metadata:
      labels:
        app: loadsim
    spec:
      containers:
      - name: loadsim
        image: 122315765326.dkr.ecr.us-east-1.amazonaws.com/loadsim:loadsim
        ports:
        - containerPort: 8080
        env:
        - name: ENVIRONMENT
          valueFrom:
            secretKeyRef:
                name: pod-secret
                key: ENVIRONMENT

        - name: CRASH
          valueFrom:
            secretKeyRef:
                name: pod-secret
                key: CRASH

        - name: CRASH_AFTER_TIME_MS
          valueFrom:
            secretKeyRef:
                name: pod-secret
                key: CRASH_AFTER_TIME_MS

---
apiVersion: v1
kind: Service
metadata:
  name: loadsim-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb" 
spec:
  selector:
    app: loadsim
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer

  



  
  